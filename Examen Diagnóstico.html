<!DOCTYPE html>
<html>
<head>
    <title>Cuestionario</title>
    <link rel="icon" type="image/png" href="https://wallpapercave.com/wp/WcKr5nB.jpg">
    <style>
        h2 {
            color: pink; /
        }
    </style>
</head>
<body>
    <h2>Examen Diagnostico</h2>
    
    <form>
        <label>Nombre completo:</label>
        <input type="text" name="nombre"><br>

        <label>Fecha de nacimiento:</label>
        <input type="date" name="fecha_nacimiento"><br>

        <label>Edad:</label>
        <input type="number" name="edad"><br>

        <label>Sexo:</label>
        <select name="sexo">
            <option>Masculino</option>
            <option>Femenino</option>
            <option>Otro</option>
        </select><br>

        <label>Ocupacion:</label>
        <input type="text" name="ocupacion"><br>

        <label>Hobbie:</label>
        <input type="text" name="hobbie"><br>

        <label>Pelicula favorita:</label>
        <input type="text" name="pelicula"><br>

        <label>Comida favorita:</label>
        <input type="text" name="comida"><br>

        <label>Animal favorito:</label>
        <input type="text" name="animal"><br>

        <label>¿Que esperas de mi en la carrera?</label><br>
        <textarea name="expectativa"></textarea><br>

        <label>¿Estas orgulloso/a de mi?</label><br>
        <input type="radio" name="orgullo" value="si"> Sí  
        <input type="radio" name="orgullo" value="no"> No<br>

        <label>Si respondiste "No" ¿por que?</label><br>
        <textarea name="razon_no"></textarea><br>

        <input type="reset" value="Enviar">
    </form>
</body>
</html>
